name: Build firmware

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned QMK source
        run: make setup
      - name: Install QMK CLI dependencies
        run: python3 -m pip install -r qmk_firmware/requirements.txt
      - name: Build firmware and source archive
        run: make package JOBS=2
      - name: Upload firmware and corresponding source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Firmware
          path: dist/*
          if-no-files-found: error
